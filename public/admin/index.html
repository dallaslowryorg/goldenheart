<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Golden Heart Admin</title>
<link rel="icon" href="/assets/images/site/favicon.png">
<link rel="stylesheet" href="/assets/css/admin.css?v=52">
<script defer src="/assets/js/admin.js?v=50"></script>
</head>
<body>
<header class="admin-header">
  <div><p class="kicker">Golden Heart Service Dogs</p><h1>Dog Directory Admin</h1><nav class="admin-nav"><a class="active" href="/admin">Dogs</a><a href="/admin/stories">Stories</a></nav></div>
  <div class="admin-user"><span id="admin-user">Signed in</span><a href="/dogs" target="_blank" rel="noopener">View public page ↗</a></div>
</header>
<main class="admin-shell">
  <section class="admin-toolbar" aria-label="Dog directory controls">
    <div><strong id="dog-total">0 dogs</strong><span id="save-status" role="status" aria-live="polite"></span></div>
    <div class="toolbar-actions"><input id="dog-search" type="search" placeholder="Search dogs" aria-label="Search dogs"><button class="button primary" id="add-dog" type="button">+ Add Dog</button></div>
  </section>
  <section id="admin-alert" class="admin-alert" hidden role="alert"></section>
  <section id="dog-list" class="admin-list" aria-live="polite"><p class="loading">Loading dog directory…</p></section>
</main>

<dialog id="dog-dialog" class="dog-dialog" aria-labelledby="dialog-title">
<form id="dog-form" method="dialog">
  <div class="dialog-header"><div><p class="kicker">Dog profile</p><h2 id="dialog-title">Add Dog</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div>
  <input type="hidden" name="id">
  <input type="hidden" name="image">
  <div class="form-grid">
    <label class="span-2">Name <input name="name" required maxlength="100" placeholder="Dog's name"></label>
    <label class="span-2">Handler / Client name <input name="handlerName" maxlength="120" placeholder="Optional — e.g. Scott"></label>
    <label>Sex
      <select name="sex">
        <option value="">Select sex</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </label>
    <label>Age <input name="age" maxlength="80" placeholder="1½ years"></label>
    <label id="location-field" class="conditional-field" hidden>Placement location <input name="location" maxlength="120" placeholder="e.g. Oklahoma"></label>
    <label class="span-2">Status
      <select name="group" required>
        <option value="available">Available / Prospect</option>
        <option value="pending">Pending</option>
        <option value="matched">Matched / In Training / Transitioning</option>
        <option value="partner">Veteran Organization Placement</option>
        <option value="graduate">Graduate</option>
      </select>
    </label>
    <label id="progress-field" class="conditional-field">Program progress <input name="progress" maxlength="200" placeholder="e.g. 75% through program or Midway"></label>
    <label id="year-field" class="conditional-field" hidden>Graduation year <input name="year" maxlength="20" placeholder="2026"></label>
    <label class="span-2">Training focus <textarea name="specialties" rows="3" placeholder="PTSD&#10;Psychiatric Support&#10;Autism Support"></textarea><small>One per line or comma-separated.</small></label>
    <label class="span-2">Profile description <textarea name="blurb" rows="5" maxlength="5000" placeholder="Optional — leave blank and Golden Heart will create a simple description from the profile details."></textarea><small>Optional. A basic public description will be generated automatically if this is left blank.</small></label>
    <fieldset class="span-2 checks"><legend>Flags</legend><label><input type="checkbox" name="veteranPlacement"> Veteran placement</label><label><input type="checkbox" name="visible" checked> Show on public site</label></fieldset>
    <div class="span-2 photo-editor">
      <div class="photo-preview-wrap"><img id="photo-preview" alt="Current dog profile photo" hidden><div id="photo-empty">No photo selected</div></div>
      <div><label>Profile photo <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><small>Uploads are resized in your browser before being saved. JPG, PNG or WebP recommended.</small><button type="button" class="button subtle" id="clear-photo">Remove photo from profile</button></div>
    </div>
  </div>
  <div class="dialog-footer"><button class="button danger" id="delete-dog" type="button" hidden>Delete Dog</button><div class="right-actions"><button class="button subtle" id="cancel-dialog" type="button">Cancel</button><button class="button primary" id="save-dog" type="submit">Save Dog</button></div></div>
</form>
</dialog>
</body>
</html>
